name = "api"
main = "main.py"
compatibility_date = "2026-09-23"
compatibility_flags = ["python_workers"]

# 🚀 极其关键：将你刚刚在网页上拿到的真实 ID 替换到下面这一行
[[d1_databases]]
binding = "DB"
database_name = "bible-db"
database_id = "a3c078f9-cf52-4284-8c56-9bb128295df5"

# 自动挂载云存储桶（用于接收你App上传的图片）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "upload-images-bucket"
