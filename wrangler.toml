name = "api"
main = "main.py"
compatibility_date = "2026-09-23"
compatibility_flags = ["python_workers"]

# 🚀 极其关键：显式命令 Cloudflare 构建引擎在云端必须离线注入这两个第三方 Python 包
python_requirement_packages = ["fastapi", "pydantic"]

[[d1_databases]]
binding = "DB"
database_name = "bible-db"
database_id = "a3c078f9-cf52-4284-8c56-9bb128295df5"
